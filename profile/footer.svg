<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="footer">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#004ba0"/>
      <stop offset="0.5" stop-color="#0b2a6b"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <style>
    .wave      { animation: drift 14s linear infinite; }
    .wave.back { animation: drift-back 9s linear infinite; }
    @keyframes drift      { from { transform: translateX(0); }      to { transform: translateX(-1200px); } }
    @keyframes drift-back { from { transform: translateX(-1200px); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .wave, .wave.back { animation: none; } }
  </style>
  <path class="wave back" fill="#4f8cff" fill-opacity="0.35"
        d="M0,110 L0,28 C200,0 400,0 600,28 C800,56 1000,56 1200,28 C1400,0 1600,0 1800,28 C2000,56 2200,56 2400,28 L2400,110 Z"/>
  <path class="wave" fill="url(#ground)"
        d="M0,110 L0,40 C200,15 400,15 600,40 C800,65 1000,65 1200,40 C1400,15 1600,15 1800,40 C2000,65 2200,65 2400,40 L2400,110 Z"/>
</svg>
