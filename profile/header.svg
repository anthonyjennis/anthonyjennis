<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Hi, I'm Anthony">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0b2a6b"/>
      <stop offset="1" stop-color="#004ba0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .wave      { animation: drift 14s linear infinite; }
    .wave.back { animation: drift-back 9s linear infinite; }
    .title     { opacity: 0; animation: rise 1.1s ease-out 0.2s forwards; }
    .sub       { opacity: 0; animation: rise 1.1s ease-out 0.9s forwards; }
    .rule      { transform-origin: 600px 0; transform: scaleX(0); animation: grow 1s ease-out 1.5s forwards; }
    @keyframes drift      { from { transform: translateX(0); }      to { transform: translateX(-1200px); } }
    @keyframes drift-back { from { transform: translateX(-1200px); } to { transform: translateX(0); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .wave, .wave.back { animation: none; }
      .title, .sub { animation: none; opacity: 1; }
      .rule { animation: none; transform: scaleX(1); }
    }
  </style>

  <!-- light fringe wave, drifts the other way -->
  <path class="wave back" fill="#4f8cff" fill-opacity="0.35"
        d="M0,0 L0,202 C200,232 400,232 600,202 C800,172 1000,172 1200,202 C1400,232 1600,232 1800,202 C2000,172 2200,172 2400,202 L2400,0 Z"/>
  <!-- main banner wave -->
  <path class="wave" fill="url(#sky)"
        d="M0,0 L0,190 C200,215 400,215 600,190 C800,165 1000,165 1200,190 C1400,215 1600,215 1800,190 C2000,165 2200,165 2400,190 L2400,0 Z"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text class="title" x="600" y="92" font-size="54" font-weight="700" fill="#ffffff">Hi, I'm Anthony</text>
    <rect class="rule" x="470" y="110" width="260" height="2" fill="url(#gold)"/>
    <text class="sub" x="600" y="142" font-size="19" fill="#c9d1d9" letter-spacing="0.5">Computer Engineering · Honours in Data Science &amp; Analytics</text>
  </g>
</svg>
